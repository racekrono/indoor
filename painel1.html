<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking em Tempo Real - Crono</title>
    <style>
        :root {
            /* Fundo dos cards bem mais transparente para revelar a imagem */
            --card-bg: rgba(15, 23, 42, 0.25);
            --card-border: rgba(255, 255, 255, 0.2);
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main);
            background: url('https://raw.githubusercontent.com/racekrono/indoor/refs/heads/main/2banner.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* Removida a camada escura pesada; agora é apenas um leve degradê nas bordas */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.15); /* Apenas 15% de escurecimento suave */
            z-index: -1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.35); 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            padding: 20px 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            margin-bottom: 30px; 
        }

        .etapa-titulo { 
            font-size: 26px; 
            font-weight: 800; 
            color: #ffffff; 
            margin: 0; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .etapa-subtitulo {
            margin: 6px 0 0 0; 
            color: var(--text-muted); 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .qr-code { 
            width: 80px; 
            height: 80px; 
            border-radius: 8px;
            border: 2px solid var(--card-border);
            background: white;
            padding: 4px;
        }

        .refresh-info { 
            color: #34d399; 
            font-weight: 700; 
            font-size: 13px; 
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(52, 211, 153, 0.4);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .cat-card {
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h3 { 
            color: #fbbf24; 
            margin: 0 0 15px 0; 
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #fbbf24;
            border-radius: 2px;
            box-shadow: 0 0 8px #fbbf24;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 5px; 
        }

        th, td { 
            padding: 14px 16px; 
            text-align: left; 
        }

        th { 
            background-color: rgba(15, 23, 42, 0.6); 
            color: #ffffff; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid var(--card-border);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.2s ease;
        }

        tr:last-child {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .pos {
            font-weight: 800;
            width: 60px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .pos-1 { color: #fbbf24; font-size: 17px; } /* Ouro vibrante */
        .pos-2 { color: #e2e8f0; font-size: 17px; } /* Prata */
        .pos-3 { color: #f97316; font-size: 17px; } /* Bronze */

        .piloto-nome {
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .tempo-destaque {
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .mensagem-vazia {
            text-align: center;
            padding: 40px;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .refresh-info {
                justify-content: center;
            }
            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-container">
            <div>
                <p class="etapa-titulo" id="displayEtapa">CONECTANDO AO BANCO...</p>
                <p class="etapa-subtitulo" id="dataRelatorio"></p>
            </div>
            <div style="text-align: right;">
                <img src="https://raw.githubusercontent.com/racekrono/indoor/refs/heads/main/QR.png" class="qr-code" alt="QR Code">
                <div class="refresh-info">
                    <span class="pulse-dot"></span> Ao Vivo
                </div>
            </div>
        </div>

        <div id="conteudoTabelas">
            <div class="mensagem-vazia">Carregando classificações em tempo real...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4ajZM_W0_qGOlrlRoPn6DUsUBUm4qAcc",
            authDomain: "crono-rrb.firebaseapp.com",
            databaseURL: "https://crono-rrb-default-rtdb.firebaseio.com",
            projectId: "crono-rrb",
            storageBucket: "crono-rrb.firebasestorage.app",
            messagingSenderId: "1472207720",
            appId: "1:1472207720:web:11502aed4117b1fda714dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let subEtapaGlobal = "e1";
        let nomeEtapaGlobal = "PROVA";

        function tParaMs(t) {
            if (!t || t === "00:00:000") return 0;
            const p = t.split(':');
            return (parseInt(p[0]) * 60000) + (parseInt(p[1]) * 1000) + parseInt(p[2]);
        }

        // Monitora configurações do evento
        db.ref('configuracao').on('value', snapshot => {
            const config = snapshot.val() || {};
            nomeEtapaGlobal = config.etapaAtual || "PROVA";
            subEtapaGlobal = config.subEtapaAtiva || "e1";
            processarEExibir();
        });

        // Monitora tempos em tempo real
        db.ref('pilotos').on('value', snapshot => {
            processarEExibir();
        });

        function processarEExibir() {
            const numEtapaTexto = subEtapaGlobal === 'e1' ? "BATERIA 01" : "BATERIA 02";
            document.getElementById('displayEtapa').innerText = `${nomeEtapaGlobal} • ${numEtapaTexto}`;
            document.getElementById('dataRelatorio').innerText = "Data: " + new Date().toLocaleDateString();

            db.ref('pilotos').once('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('conteudoTabelas').innerHTML = '<div class="mensagem-vazia">Nenhum tempo registrado até o momento.</div>';
                    return;
                }

                let lista = [];
                for (let k in data) {
                    const p = data[k];
                    const v1 = p[`${subEtapaGlobal}_v1`] || "00:00:000";
                    const totalMs = tParaMs(v1);

                    lista.push({ 
                        ...p, 
                        tempoStr: v1,
                        totalMs: totalMs
                    });
                }

                const categorias = ["PRODUCTION", "SUPER PRODUCTION", "PROTOTIPO", "UTV", "INICIANTE"];
                let html = '';

                categorias.forEach(cat => {
                    let filtrados = lista.filter(p => p.categoria === cat && p.totalMs > 0).sort((a,b) => a.totalMs - b.totalMs);
                    
                    if (filtrados.length > 0) {
                        html += `
                        <div class="cat-card">
                            <h3>CATEGORIA: ${cat}</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 80px;">Pos</th>
                                        <th>Piloto</th>
                                        <th style="text-align: right;">Tempo da Bateria</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        
                        filtrados.forEach((p, i) => {
                            let posClass = "";
                            if (i === 0) posClass = "pos-1";
                            else if (i === 1) posClass = "pos-2";
                            else if (i === 2) posClass = "pos-3";

                            html += `
                                <tr>
                                    <td class="pos ${posClass}">${i+1}º</td>
                                    <td class="piloto-nome">${p.piloto}</td>
                                    <td style="text-align: right;"><span class="tempo-destaque">${p.tempoStr}</span></td>
                                </tr>`;
                        });
                        
                        html += `
                                </tbody>
                            </table>
                        </div>`;
                    }
                });
                
                document.getElementById('conteudoTabelas').innerHTML = html || '<div class="mensagem-vazia">Aguardando lançamento dos tempos...</div>';
            });
        }
    </script>
</body>
</html>
