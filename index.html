<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Lançamento - Crono</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #27ae60;
        }
        .btn-salvar {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-salvar:hover {
            background-color: #219150;
        }
        .piloto-box {
            border: 1px solid #dcdde1;
            padding: 12px;
            border-radius: 8px;
            background-color: #fafafa;
            margin-bottom: 15px;
        }
        .piloto-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-group">
            <input type="text" id="nomeEtapa" placeholder="Nome da Etapa (Ex: PROVA 1)">
        </div>

        <div class="form-group">
            <select id="subEtapaSelect">
                <option value="e1">BATERIA 1 (Lançar Voltas 1 e 2)</option>
                <option value="e2">BATERIA 2 (Lançar Voltas 1 e 2)</option>
            </select>
        </div>

        <div class="form-group">
            <select id="categoriaSelect">
                <option value="PRODUCTION">PRODUCTION</option>
                <option value="SUPER PRODUCTION">SUPER PRODUCTION</option>
                <option value="PROTOTIPO">PROTOTIPO</option>
                <option value="UTV">UTV</option>
                <option value="INICIANTE">INICIANTE</option>
            </select>
        </div>

        <!-- PILOTO 1 -->
        <div class="piloto-box">
            <div class="piloto-title">Piloto 1</div>
            <div class="form-group" style="margin-bottom: 10px;">
                <select id="pilotoSelect1">
                    <option value="">SELECIONE O PILOTO...</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="tempoInput1" placeholder="00:00:000">
            </div>
        </div>

        <!-- PILOTO 2 -->
        <div class="piloto-box">
            <div class="piloto-title">Piloto 2</div>
            <div class="form-group" style="margin-bottom: 10px;">
                <select id="pilotoSelect2">
                    <option value="">SELECIONE O PILOTO...</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="tempoInput2" placeholder="00:00:000">
            </div>
        </div>

        <button class="btn-salvar" onclick="salvarVolta()">SALVAR VOLTA</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4ajZM_W0_qGOlrlRoPn6DUsUBUm4qAcc",
            authDomain: "crono-rrb.firebaseapp.com",
            databaseURL: "https://crono-rrb-default-rtdb.firebaseio.com",
            projectId: "crono-rrb",
            storageBucket: "crono-rrb.firebasestorage.app",
            messagingSenderId: "1472207720",
            appId: "1:1472207720:web:11502aed4117b1fda714dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let todosPilotos = {};

        // Sincroniza a configuração de Nome da Etapa e SubEtapa
        const nomeEtapaInput = document.getElementById('nomeEtapa');
        const subEtapaSelect = document.getElementById('subEtapaSelect');

        db.ref('configuracao').on('value', snapshot => {
            const config = snapshot.val() || {};
            if (config.etapaAtual && document.activeElement !== nomeEtapaInput) {
                nomeEtapaInput.value = config.etapaAtual;
            }
            if (config.subEtapaAtiva) {
                subEtapaSelect.value = config.subEtapaAtiva;
            }
        });

        nomeEtapaInput.addEventListener('change', () => {
            db.ref('configuracao/etapaAtual').set(nomeEtapaInput.value);
        });

        subEtapaSelect.addEventListener('change', () => {
            db.ref('configuracao/subEtapaAtiva').set(subEtapaSelect.value);
        });

        // Carrega a lista de pilotos do banco
        db.ref('pilotos').on('value', snapshot => {
            todosPilotos = snapshot.val() || {};
            atualizarSelectsPilotos();
        });

        document.getElementById('categoriaSelect').addEventListener('change', atualizarSelectsPilotos);

        function atualizarSelectsPilotos() {
            const cat = document.getElementById('categoriaSelect').value;
            const select1 = document.getElementById('pilotoSelect1');
            const select2 = document.getElementById('pilotoSelect2');

            const valorAnterior1 = select1.value;
            const valorAnterior2 = select2.value;

            let html = '<option value="">SELECIONE O PILOTO...</option>';

            for (let k in todosPilotos) {
                if (todosPilotos[k].categoria === cat) {
                    html += `<option value="${k}">${todosPilotos[k].piloto}</option>`;
                }
            }

            select1.innerHTML = html;
            select2.innerHTML = html;

            select1.value = valorAnterior1;
            select2.value = valorAnterior2;
        }

        async function salvarVolta() {
            const subEtapa = subEtapaSelect.value; // 'e1' ou 'e2'
            
            const p1 = document.getElementById('pilotoSelect1').value;
            const t1 = document.getElementById('tempoInput1').value.trim();

            const p2 = document.getElementById('pilotoSelect2').value;
            const t2 = document.getElementById('tempoInput2').value.trim();

            if ((!p1 || !t1) && (!p2 || !t2)) {
                alert("Por favor, selecione ao menos um piloto e insira o tempo!");
                return;
            }

            let operacoes = [];

            function definirVoltaESalvar(idPiloto, tempo) {
                const dadosPiloto = todosPilotos[idPiloto] || {};
                const v1 = dadosPiloto[`${subEtapa}_v1`];
                
                // Se a volta 1 estiver vazia ou for "00:00:000", salva na v1; senão, salva na v2.
                let campoVolta = `${subEtapa}_v1`;
                if (v1 && v1 !== "00:00:000") {
                    campoVolta = `${subEtapa}_v2`;
                }

                return db.ref(`pilotos/${idPiloto}/${campoVolta}`).set(tempo);
            }

            if (p1 && t1) {
                operacoes.push(definirVoltaESalvar(p1, t1));
            }

            if (p2 && t2) {
                operacoes.push(definirVoltaESalvar(p2, t2));
            }

            try {
                await Promise.all(operacoes);
                document.getElementById('tempoInput1').value = '';
                document.getElementById('tempoInput2').value = '';
                alert("Volta(s) gravada(s) com sucesso!");
            } catch (err) {
                alert("Erro ao salvar no banco de dados.");
                console.error(err);
            }
        }
    </script>
</body>
</html>
